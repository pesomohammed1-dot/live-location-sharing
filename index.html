<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مشاركة موقعي</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
body {
  font-family: Arial;
  text-align: center;
  background: #101820;
  color: white;
  padding: 15px;
}
button {
  padding: 14px 22px;
  margin: 8px;
  border: 0;
  border-radius: 9px;
  font-size: 17px;
}
#map {
  height: 400px;
  border-radius: 12px;
  margin-top: 20px;
}
</style>
</head>

<body>

<h2>مشاركة موقعي الجغرافي</h2>

<p>لن تتم مشاركة موقعك إلا بعد موافقتك.</p>

<button onclick="startSharing()">موافقة ومشاركة موقعي</button>
<button onclick="stopSharing()">إيقاف المشاركة</button>

<p id="status">المشاركة متوقفة</p>
<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
const map = L.map('map').setView([30.0444, 31.2357], 6);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
 attribution: '&copy; OpenStreetMap'
}).addTo(map);

let marker;
let watchId = null;

function startSharing() {
  if (!navigator.geolocation) {
    document.getElementById('status').textContent =
      'المتصفح لا يدعم تحديد الموقع';
    return;
  }

  if (watchId !== null) return;

  document.getElementById('status').textContent =
    'جاري تحديد موقعك...';

  watchId = navigator.geolocation.watchPosition(
    function(position) {
      const lat = position.coords.latitude;
      const lng = position.coords.longitude;

      document.getElementById('status').textContent =
        'موقعك الحالي: ' + lat.toFixed(5) + ', ' + lng.toFixed(5);

      map.setView([lat, lng], 16);

      if (marker) {
        marker.setLatLng([lat, lng]);
      } else {
        marker = L.marker([lat, lng]).addTo(map);
      }
    },
    function(error) {
      document.getElementById('status').textContent =
        'تعذر تحديد الموقع. تأكد من السماح بإذن الموقع.';
    },
    {
      enableHighAccuracy: true,
      maximumAge: 0,
      timeout: 15000
    }
  );
}

function stopSharing() {
  if (watchId !== null) {
    navigator.geolocation.clearWatch(watchId);
    watchId = null;
  }

  document.getElementById('status').textContent =
    'تم إيقاف مشاركة الموقع';
}
</script>

</body>
</html>
